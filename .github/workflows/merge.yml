name: Merge bot

# The owner's rule, verbatim: "Only if nothing visible changes (Recommended)", run as a merge train (merge-bot.mjs).
# Every run is one tick: it checks main's own gate first (red: nothing merges, an issue is opened), then takes the
# oldest green, frames-identical PR from a claude/* branch and either merges it, if its gate ran on a head that
# contains main as it is now, or brings its branch up to date from main so its gate runs again on top of it.
# One run at a time (one group for the whole repository), so two PRs never land in the same minute unchecked.
# Both triggers run main's copy of this file and of the bot, never a PR's. A PR that changes the bot is always
# left to the owner. Without the MERGE_TOKEN secret the bot does nothing.
on:
  workflow_run:
    workflows: [Gate]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

# One tick at a time. A tick queued behind another replaces any older queued one, which loses nothing: every tick
# looks at main and every open PR afresh.
concurrency:
  group: merge-train
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'pull_request_target' && startsWith(github.event.pull_request.head.ref, 'claude/') ||
      github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/ci
      - name: One tick of the merge train
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .github/ci/merge-bot.mjs
