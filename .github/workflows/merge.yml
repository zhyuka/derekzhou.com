name: Merge bot

# The owner's rule, verbatim: "Only if nothing visible changes (Recommended)", run without a global lock (merge-bot.mjs;
# the owner's "Yes, build it", 2026-11-06). Every tick lands each ready, green, frames-identical claude/* PR whose areas
# main has not touched since its gate's base (main's own gate tests every merge after it lands), re-gates only the PRs
# that overlap, and fast-forwards `live` (the branch Cloudflare serves) to the newest main tip whose gate is green.
# Gate runs, PR events and pushes run main's copy of this file and of the bot, never a PR's. By hand (workflow_dispatch)
# it runs the chosen branch's bot in dry mode only: it logs what it would do, with no MERGE_TOKEN. A PR that changes the
# bot is always left to the owner. Without the MERGE_TOKEN secret the bot does nothing.
on:
  workflow_run:
    workflows: [Gate, Stills]   # (Stills: the PC's stills job set a main tip's `stills` status, which the deploy gate reads)
    types: [completed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:   # (a dry run of the chosen branch's bot: it changes nothing)

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  statuses: read   # (the deploy gate reads a main tip's `stills` status)

# One tick at a time. A tick queued behind another replaces any older queued one, which loses nothing: every tick
# looks at main and every open PR afresh.
concurrency:
  group: merge-train${{ github.event_name == 'workflow_dispatch' && '-dry' || '' }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'claude/') ||
      github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'claude/'))
    runs-on: [self-hosted, linux, pc-wsl]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
          sparse-checkout: .github/ci
      - name: One tick of the merge train
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ github.event_name != 'workflow_dispatch' && secrets.MERGE_TOKEN || '' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          REPO: ${{ github.repository }}
        run: node .github/ci/merge-bot.mjs
