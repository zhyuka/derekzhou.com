# gpu.yml: the graphics checks on the PC's RTX 4090 (a self-hosted runner, labels gpu-4090 / gpu-exclusive:
# .work/hub/speed/RUNNER-SETUP.md in the workspace).
#   T2 (a gate): base (the PR's base) against head rendered in one job: the page's clock stepped, frames +1..+600 hashed
#      in the page from readPixels (no screenshots) at 1440x900 day/dawn and 393x852 night/day, with a null test (base
#      against itself); the kit's noise rule; the served site's CSP; every shader's source compared and, where GLSL
#      changed, the D3D11 read-back of the changed programs bit for bit (tools/gpu/t2.js). About a minute.
#   T3 (a report): base against head timed, A B A B, 5 runs each, fresh profiles (tools/gpu/t3.js). Nightly or the
#      `perf` label.
#   Forced colours off (a gate, in T2's job): forced colours on at load and off after the show, and on mid-visit then
#      off, at 1440x900 and 393x852@3 on the real clock, on head's plain build (served/head, the bytes visitors get;
#      never the twin, whose world holds its first frame); the job fails unless the world is shown again within 8 s
#      each time, a failed case run once more (tools/gpu/forced-off.js; on this GPU 0.2-0.7 s, 1.1-1.3 s while other
#      work shares it; a build that read forced colours from the media query list it listens on never brought it
#      back). About half a minute.
# Triggers: called by the gate workflow (workflow_call, with the base) when its shader census reports glsl_changed or
# the world's, the realms' or the birds' served JS changed; a PR labelled `perf` (T3 only); nightly; by hand. Outputs
# for the merge bot: frames_identical, glsl_changed, bits_identical, bits_differ, csp_ok.
# The checks run main's copy of tools/gpu (the base's), never the PR's own, so a PR cannot change its own gate; a PR
# that brings tools/gpu for the first time runs its own. What they render is base's and head's builds (site/ holds only
# sources): the gate's plan job's hand-off on the PC's disk (.github/ci/handoff.mjs) when the gate calls this, else the `served` job's here (the PC's Linux
# runner, .github/ci/served.sh). The PC never runs a PR's build.
name: gpu
on:
  pull_request:
    types: [labeled]   # (T3 on the `perf` label; T2 comes from the gate, so it does not run twice)
  schedule:
    - cron: '17 9 * * *'   # nightly (09:17 UTC: the PC's night is the owner's)
  workflow_dispatch:
  workflow_call:
    inputs:
      base:
        description: "the commit to compare against (the gate's base, main's tip where the branch left it)"
        type: string
        required: true
      frames:
        description: "'no' leaves out T2's frames and forced colours (main after a fast-forward: the PR's gate compared these builds); the stall visits still run"
        type: string
        default: 'yes'
      served_sha:
        description: "the plan's hand-off of the two builds, its manifest's sha256 (the gate's plan job output): T2 reads them pinned to it"
        type: string
        default: ''
      stall:
        description: "'no' leaves out the stall visits (a PR's gate: they run on main's gate, which the deploy gate reads)"
        type: string
        default: 'yes'
    outputs:
      frames_identical: { value: '${{ jobs.t2.outputs.frames_identical }}' }
      glsl_changed: { value: '${{ jobs.t2.outputs.glsl_changed }}' }
      bits_identical: { value: '${{ jobs.t2.outputs.bits_identical }}' }
      bits_differ: { value: '${{ jobs.t2.outputs.bits_differ }}' }
      stall_ok: { value: '${{ jobs.t2.outputs.stall_ok }}' }
      csp_ok: { value: '${{ jobs.t2.outputs.csp_ok }}' }
permissions:
  contents: read
concurrency:
  group: gpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PW_VERSION: '1.64.1'   # playwright-core (Apache-2.0): drives the machine's own Chrome (channel 'chrome')
jobs:
  served:
    # (called by the gate, with a base: the gate's plan job made the `served` artifact already; a label other than
    # `perf`, such as the bot's needs-owner, runs nothing here)
    # (and never a fork's PR: its code would run on the PC)
    if: inputs.base == '' && (github.event.action != 'labeled' || github.event.label.name == 'perf') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, pc-wsl]
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.handoff.outputs.sha }}   # (the hand-off's manifest, sha256: T2 and T3 pin it)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # (credentials kept, as the gate's plan job: served.sh fetches the base's objects)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Base and head, built
        run: bash .github/ci/served.sh '${{ github.event.pull_request.base.sha || github.sha }}' "$RUNNER_TEMP/served"
      - name: The two builds, handed to T2 and T3 (the PC's disk, .github/ci/handoff.mjs, as the gate's plan job)
        id: handoff
        run: |
          node .github/ci/handoff.mjs sweep --hours 24
          node .github/ci/handoff.mjs put "$RUNNER_TEMP/served" served
  t2:
    needs: served
    if: always() && !cancelled() && needs.served.result != 'failure' && github.event.action != 'labeled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)   # (drafts too: a PC session's draft gets its answer; a label added runs only T3)
    runs-on: [self-hosted, windows, gpu-4090]
    timeout-minutes: 20
    outputs:
      frames_identical: ${{ steps.t2.outputs.frames_identical }}
      glsl_changed: ${{ steps.t2.outputs.glsl_changed }}
      bits_identical: ${{ steps.t2.outputs.bits_identical }}
      bits_differ: ${{ steps.t2.outputs.bits_differ }}
      stall_ok: ${{ steps.stall.outputs.stall_ok }}
      csp_ok: ${{ steps.t2.outputs.csp_ok }}
    steps:
      - name: head
        uses: actions/checkout@v4
        with: { path: head, persist-credentials: false }
      - name: base
        uses: actions/checkout@v4
        with: { path: base, ref: '${{ inputs.base || github.event.pull_request.base.sha || github.sha }}', persist-credentials: false }
      - name: playwright-core
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"   # (Windows PowerShell 5.1, which every Windows machine has; pwsh is not on the PC. Bypass for this step's process only: the account's policy stays)
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'pw'
          npm install --no-save --no-audit --no-fund --prefix $d "playwright-core@$env:PW_VERSION" | Out-Null
          "PW_CORE=$(Join-Path $d 'node_modules\playwright-core')" | Add-Content -Encoding ascii $env:GITHUB_ENV   # (ascii: PowerShell 5.1's utf8 writes a BOM GitHub would read as part of the name)
      - name: the two builds (the hand-off on the PC's disk, checked against its manifest; the gate's plan job, or this run's served job)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          HANDOFF_SHA: ${{ inputs.served_sha || needs.served.outputs.sha }}   # (pinned: the putting job's output, the gate's plan or this run's served)
        run: |
          $h = if (Test-Path base/.github/ci/handoff.mjs) { 'base/.github/ci/handoff.mjs' } else { 'head/.github/ci/handoff.mjs' }   # (the base's reader, as the checks: a PR cannot loosen its own manifest check)
          node $h get served served --pinned
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0
      - name: T2
        id: t2
        if: inputs.frames != 'no'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"   # (Windows PowerShell 5.1, which every Windows machine has; pwsh is not on the PC. Bypass for this step's process only: the account's policy stays)
        run: |
          $tools = if (Test-Path base/tools/gpu/t2.js) { 'base/tools/gpu' } else { 'head/tools/gpu' }
          $profiles = Join-Path (Split-Path $env:RUNNER_WORKSPACE -Parent) '_gpu-profiles'   # kept between runs: Chrome's GPU program cache
          # settled twins when the build made them (served.sh, tools/gpu/twin.js): every visit shows the same settled world at
          # page time 4 s; else the plain builds, each visit from its own first shown frame
          if ((Test-Path served/base-twin) -and (Test-Path served/head-twin)) { $b = 'served/base-twin'; $h = 'served/head-twin'; $st = @('--settle', '4000') } else { $b = 'served/base'; $h = 'served/head'; $st = @() }
          node "$tools/t2.js" --base $b --head $h --out "$env:RUNNER_TEMP/t2" --par 4 --profiles $profiles @st
      - name: stall visits
        id: stall
        if: always() && (steps.t2.outcome != 'skipped' || inputs.frames == 'no') && inputs.stall != 'no'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"   # (Windows PowerShell 5.1, which every Windows machine has; pwsh is not on the PC. Bypass for this step's process only: the account's policy stays)
        run: |
          # first use of every pipeline key on the real clock, fresh profiles, the bytes visitors get (tools/gpu/stall.js:
          # WebGL watched in the harness by glwatch.js); a stall is a key over 30 ms in both head visits and in neither base one
          $tools = if (Test-Path base/tools/gpu/stall.js) { 'base/tools/gpu' } else { 'head/tools/gpu' }
          node "$tools/stall.js" --base served/base --head served/head --out "$env:RUNNER_TEMP/t2" --par 3
      - name: forced colours off
        id: fcoff
        if: always() && steps.t2.outcome != 'skipped'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"   # (Windows PowerShell 5.1, which every Windows machine has; pwsh is not on the PC. Bypass for this step's process only: the account's policy stays)
        run: |
          # (fast500's deep sweep, 2026-11-05) forced colours from the load and begun mid-visit, each then ended: the world
          # must be shown again (tools/gpu/forced-off.js: the real clock, fresh headless Chrome, a failed case run once
          # more) on head's plain build, the bytes visitors get (never the twin, whose world holds its first frame).
          # Base's copy of the check, else head's where the head brings it; then base is visited too, a report only (never
          # the gate), to show the bug there. Neither has it: skipped.
          $tools = if (Test-Path base/tools/gpu/forced-off.js) { 'base/tools/gpu' } elseif (Test-Path head/tools/gpu/forced-off.js) { 'head/tools/gpu' } else { '' }
          if (-not $tools) { 'forced-off.js: in neither base/ nor head/: skipped'; exit 0 }
          node "$tools/forced-off.js" --site served/head --out "$env:RUNNER_TEMP/forced-off" --bound 8 --retry 1 --label head
          $rc = $LASTEXITCODE
          if ($tools -eq 'head/tools/gpu') {
            node "$tools/forced-off.js" --site served/base --out "$env:RUNNER_TEMP/forced-off/base" --bound 8 --wait 6 --retry 0 --port 9680 --label 'base, a report'
            "base (a report, never the gate): exit $LASTEXITCODE"
          }
          exit $rc
      - name: report
        if: always()
        continue-on-error: true   # (a report for people, read by nothing: the artifact quota never fails T2)
        uses: actions/upload-artifact@v4
        with: { name: t2, path: '${{ runner.temp }}/t2/*.*', retention-days: 14, if-no-files-found: ignore }
      - name: forced-off report
        if: always()
        continue-on-error: true   # (a report for people, read by nothing: the artifact quota never fails T2)
        uses: actions/upload-artifact@v4
        with: { name: forced-off, path: '${{ runner.temp }}/forced-off', retention-days: 14, if-no-files-found: ignore }
  t3:
    needs: served
    if: always() && !cancelled() && needs.served.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf'))) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, gpu-exclusive]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: head, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { path: base, ref: '${{ inputs.base || github.event.pull_request.base.sha || github.sha }}', persist-credentials: false }
      - name: playwright-core
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"   # (Windows PowerShell 5.1, which every Windows machine has; pwsh is not on the PC. Bypass for this step's process only: the account's policy stays)
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'pw'
          npm install --no-save --no-audit --no-fund --prefix $d "playwright-core@$env:PW_VERSION" | Out-Null
          "PW_CORE=$(Join-Path $d 'node_modules\playwright-core')" | Add-Content -Encoding ascii $env:GITHUB_ENV   # (ascii: PowerShell 5.1's utf8 writes a BOM GitHub would read as part of the name)
      - name: the two builds (the hand-off on the PC's disk, checked against its manifest; the gate's plan job, or this run's served job)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          HANDOFF_SHA: ${{ inputs.served_sha || needs.served.outputs.sha }}   # (pinned: the putting job's output, the gate's plan or this run's served)
        run: |
          $h = if (Test-Path base/.github/ci/handoff.mjs) { 'base/.github/ci/handoff.mjs' } else { 'head/.github/ci/handoff.mjs' }   # (the base's reader, as the checks: a PR cannot loosen its own manifest check)
          node $h get served served --pinned
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0
      - name: T3
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"   # (Windows PowerShell 5.1, which every Windows machine has; pwsh is not on the PC. Bypass for this step's process only: the account's policy stays)
        run: |
          $tools = if (Test-Path base/tools/gpu/t3.js) { 'base/tools/gpu' } else { 'head/tools/gpu' }
          node "$tools/t3.js" --base served/base --head served/head --out "$env:RUNNER_TEMP/t3" --runs 5 --cases d11,n23
      - if: always()
        continue-on-error: true   # (a report for people, read by nothing: the artifact quota never fails T2)
        uses: actions/upload-artifact@v4
        with: { name: t3, path: '${{ runner.temp }}/t3/*.*', retention-days: 30, if-no-files-found: ignore }
