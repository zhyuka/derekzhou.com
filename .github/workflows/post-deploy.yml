name: Post-deploy

# After a push to main (Cloudflare Pages deploys main by its own git integration): wait, up to 10 minutes, for
# https://derekzhou.com/ to serve this commit, then smoke it (smoke.mjs: every referenced file 200 and immutable, the
# CSP and HSTS, the 404 page, the private paths behind Access, the repository's own files not served). On a failure
# an issue is opened (one per commit), for the owner's one-click rollback in Cloudflare.
on:
  push:
    branches: [main]
    paths-ignore: ['.work/**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: post-deploy
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, linux, pc-wsl]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build what Cloudflare deploys (the content-named files, their _headers, build.txt)
        run: |
          # The live site is tools/build.mjs's output (each script and stylesheet named by its content, every reference
          # rewritten, build.txt the commit), not site/ itself: the smoke compares against that build.
          if [ -f tools/build.mjs ]; then npm ci --no-audit --no-fund --ignore-scripts && node tools/build.mjs "$RUNNER_TEMP/dist"; else cp -r site "$RUNNER_TEMP/dist"; fi
      - name: Wait for the live site to serve this commit, then smoke it
        id: smoke
        run: node .github/ci/smoke.mjs --url https://derekzhou.com --site "$RUNNER_TEMP/dist" --sha "$GITHUB_SHA" --timeout 600 --out "$RUNNER_TEMP/smoke.json"
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Post-deploy smoke failed for ${GITHUB_SHA::10}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then echo "already open"; exit 0; fi
          {
            echo "The live site failed its smoke after \`$GITHUB_SHA\` reached main."
            echo
            if [ -f "$RUNNER_TEMP/smoke.json" ]; then jq -r '.fail[] | "- **" + . + "**"' "$RUNNER_TEMP/smoke.json"; else echo "- the smoke did not finish"; fi
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Rollback: Cloudflare dashboard, Workers & Pages, derekzhou, Deployments: the previous production deployment, Rollback."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
