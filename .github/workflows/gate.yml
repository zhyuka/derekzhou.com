name: Gate

# The gates every push runs (T0, T1, the verdict), whose verdict merge.yml reads. Pushes that touch only
# .work/** run nothing. A newer push to a branch cancels the run before it (main's runs are never cancelled).
on:
  push:
    branches-ignore: [live]   # (live is only ever fast-forwarded to a main tip, whose own gate already ran)
    paths-ignore: ['.work/**']
  workflow_dispatch:
    inputs:
      t1_cache:
        description: "T1's base records: use (the default), verify (render fresh and prove each record the fresh base's), off"
        type: choice
        options: [use, verify, 'off']
        default: use

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # T0, static: every check of validate.yml (the site's rules, the build, the shaders' guard, W7), as before.
  static:
    uses: ./.github/workflows/validate.yml

  # T0, the plan: which files changed and what they touch (areas.json), whether what is served is byte for byte the
  # base's, and so which gates run. site/ holds only sources: what a visitor gets is the build, so base and head are
  # built here (served.sh: each commit's tools/build.mjs --plain) and compared file by file. The two builds go to the
  # `served` artifact: the census, T1 and T2 render exactly these, and nothing builds a PR's code anywhere else.
  plan:
    runs-on: [self-hosted, linux, pc-wsl]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # (the PR's gate-verdict artifact, in T2's probe)
    outputs:
      t2_run: ${{ steps.p.outputs.run }}
      t2_cached: ${{ steps.p.outputs.cached }}
      t2_frames: ${{ steps.p.outputs.frames }}
      base: ${{ steps.base.outputs.base }}
      areas: ${{ steps.areas.outputs.areas }}
      site_changed: ${{ steps.areas.outputs.site_changed }}
      run_t1: ${{ steps.areas.outputs.run_t1 }}
      gpu_js: ${{ steps.areas.outputs.gpu_js }}
      t2_self: ${{ steps.areas.outputs.t2_self }}
      input_changed: ${{ steps.areas.outputs.input_changed }}
      input_files: ${{ steps.areas.outputs.input_files }}
      base_build: ${{ steps.builds.outputs.base }}
      head_build: ${{ steps.builds.outputs.head }}
      t2_key: ${{ steps.t2key.outputs.key }}
      glsl_changed: ${{ steps.glsl.outputs.glsl_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The base (main's tip where this branch left it; on main, main's tip before this push)
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # On main the base is the main tip before this push (the push's `before`): a PR the merge bot fast-forwarded
          # lands with its own branch as first parent, so HEAD^1 would credit main's other changes to it.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            base="$BEFORE"; if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git merge-base --is-ancestor "$base" HEAD; then base=$(git rev-parse HEAD^1); fi
          else base=$(git merge-base origin/main HEAD); fi
          echo "base=$base" >> "$GITHUB_OUTPUT"; echo "base $base, head $GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Base and head, built (what each serves)
        run: bash .github/ci/served.sh ${{ steps.base.outputs.base }} "$RUNNER_TEMP/served"
      - name: Each build's content hash (T1's records are kept by it)
        id: builds
        run: |
          h() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-24); }
          echo "base=$(h "$RUNNER_TEMP/served/base")" >> "$GITHUB_OUTPUT"; echo "head=$(h "$RUNNER_TEMP/served/head")" >> "$GITHUB_OUTPUT"
      # T0, the shader census: whether any shader's text changed, base against head, read from each build in
      # glsl_guard's fake browser (node, five GPUs: .github/ci/glsl-changed.mjs; about 15 s, no Chrome). glsl_changed
      # asks for T2, which reads the changed programs back on the 4090.
      - name: The shader census (base against head)
        id: glsl
        run: |
          if [ "${{ steps.builds.outputs.base }}" = "${{ steps.builds.outputs.head }}" ]; then echo "glsl_changed=false (the two builds are byte for byte the same)"; echo "glsl_changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node .github/ci/glsl-changed.mjs "$RUNNER_TEMP/served/base" "$RUNNER_TEMP/served/head"
      - name: T2's cache key (its answer is a function of both builds, the T2 code that runs and the stall mode)
        id: t2key
        run: |
          b=${{ steps.base.outputs.base }}; t() { git rev-parse "$1" 2>/dev/null || echo none; }
          s=$([ "$GITHUB_REF" = "refs/heads/main" ] && echo yes || echo no)
          echo "key=t2-v1-${{ steps.builds.outputs.base }}-${{ steps.builds.outputs.head }}-$(t $b:tools/gpu)-$(t HEAD:tools/gpu)-$(t HEAD:.github/workflows/gpu.yml)-stall$s" >> "$GITHUB_OUTPUT"
      - name: What the change touches
        id: areas
        run: node .github/ci/areas.mjs ${{ steps.base.outputs.base }} "$GITHUB_SHA" --served "$RUNNER_TEMP/served"
      - uses: actions/upload-artifact@v4
        with:
          name: served
          path: ${{ runner.temp }}/served
          include-hidden-files: true   # (site/.well-known/security.txt is served)
          retention-days: 7
      # T2's probe (once its own job: one queue hop less on every gate)
      # T2's answer for these two builds and this T2 code, if a run of this branch (or of main) already has it: then the
      # 4090 is not asked again (a re-gate after main moved elsewhere, a re-run). Saved by the verdict job.
      - name: T2's answer, if these builds were compared before
        id: cache
        if: steps.glsl.outputs.glsl_changed == 'true' || steps.areas.outputs.gpu_js == 'true' || steps.areas.outputs.t2_self == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/t2c/t2.json
          key: ${{ steps.t2key.outputs.key }}
      # On main: a PR's gate that compared the same two served builds with the same T2 code (its t2_key, the stall
      # mode aside) answered for main too, whatever the commits (a fast-forward, or the owner's merge of a PR whose
      # neighbour served nothing new). Read from its verdict (a branch's cache is not main's to read): the PRs of this
      # commit, and this commit's own branch runs. The 4090 then runs only main's stall visits.
      - name: The PR's T2 answer, on main (the same served builds)
        id: pr
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && steps.cache.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
          KEY: ${{ steps.t2key.outputs.key }}
          D: ${{ runner.temp }}/t2pr
        run: |
          api() { curl -fsSL --max-time 30 --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          R="https://api.github.com/repos/$GITHUB_REPOSITORY"; K="${KEY%-stall*}"
          shas="$GITHUB_SHA $(api "$R/commits/$GITHUB_SHA/pulls" | jq -r '.[] | select(.merged_at != null) | .head.sha' | tr '\n' ' ')"
          ids=$(for s in $shas; do api "$R/actions/workflows/gate.yml/runs?head_sha=$s&status=success&per_page=20" | jq -r '.workflow_runs[] | select(.head_branch != "main") | .id'; done | sort -u)
          for id in $ids; do
            a=$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" | jq -r '.artifacts[] | select(.name == "gate-verdict") | .archive_download_url' | head -1)
            [ -n "$a" ] || continue
            rm -rf "$D"; mkdir -p "$D"; api -o "$D/v.zip" "$a" && unzip -qo "$D/v.zip" -d "$D" || continue
            if jq -e --arg s "$GITHUB_SHA" --arg b "$BASE" --arg k "$K" '((.t2_key // "" | sub("-stall(yes|no)$"; "")) == $k or (.sha == $s and .base == $b)) and .t2.ran == true and (.t2.frames_identical | type) == "boolean"' "$D/verdict.json" >/dev/null; then
              jq -c '.t2 | {frames_identical, glsl_changed, bits_identical, bits_differ, csp_ok} | map_values(if . == null then "" else tostring end)' "$D/verdict.json" > "$D/t2.json"
              echo "the PR's gate (run $id) compared these builds: $(cat "$D/t2.json")"; echo "hit=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "no PR gate compared these served builds: T2 runs in full"
      - id: p
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
          PRHIT: ${{ steps.pr.outputs.hit }}
          PRC: ${{ runner.temp }}/t2pr/t2.json
          C: ${{ runner.temp }}/t2c/t2.json
          WANTED: ${{ steps.glsl.outputs.glsl_changed == 'true' || steps.areas.outputs.gpu_js == 'true' || steps.areas.outputs.t2_self == 'true' }}
          TOKEN: ${{ secrets.MERGE_TOKEN }}
          T2_RUNNER: ${{ vars.T2_RUNNER }}
        run: |
          if [ "$WANTED" != "true" ]; then echo "T2 not wanted (no shader, world/realm/bird JS or T2 change)"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$HIT" = "true" ] && jq -e '.frames_identical != null and .frames_identical != ""' "$C" >/dev/null 2>&1; then
            echo "T2's answer for these builds is cached: $(jq -c . "$C")"; echo "run=false" >> "$GITHUB_OUTPUT"; echo "cached=$(jq -c . "$C")" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$PRHIT" = "true" ]; then echo "cached=$(jq -c . "$PRC")" >> "$GITHUB_OUTPUT"; echo "frames=no" >> "$GITHUB_OUTPUT"; fi
          online=false
          if [ "$T2_RUNNER" = "off" ]; then
            how="the variable T2_RUNNER is off"
          elif [ -z "$TOKEN" ]; then
            how="no MERGE_TOKEN to ask GitHub with"
          elif r=$(curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100"); then
            echo "$r" | jq -r '.runners[] | "runner \(.name): \(.status)\(if .busy then ", busy" else "" end) [\([.labels[].name] | join(","))]"'
            n=$(echo "$r" | jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "gpu-4090"))] | length')
            [ "${n:-0}" -gt 0 ] && online=true
            how="$n online runner(s) labelled gpu-4090"
          else
            how="the runners query failed (MERGE_TOKEN needs Administration: read)"
          fi
          echo "T2 wanted; runner online: $online ($how)"
          if [ "$online" != "true" ]; then echo "::notice::T2 would run for this change, but it is skipped: $how. The verdict rests on T0 and T1."; fi
          echo "run=$online" >> "$GITHUB_OUTPUT"

  # T1, the software A/B: base and head served side by side and rendered in the same job (SwiftShader, the clock
  # paused and stepped, frames hashed in the page), a null test (base against base) in every shard. Stills and short
  # stepped sequences at 393x852 at 3 and 1440x900, the split height's device, reduced motion, no WebGL2, the 404
  # page; DOM stills; a CSP-violation listener. Base and head are the plan's two builds. Only when what is served or
  # the harness changed: with the builds byte for byte the same, what a visitor is served is identical by construction.
  # The base is rendered once per build: each shard's record of a build (its frames', DOM's and stills' hashes, errors
  # and CSP reports) is cached by the plain build's content hash (no build.txt in it, so only bytes a visitor gets),
  # the runner's OS and CPU architecture and the harness's files (Chromium and SwiftShader are the pinned Playwright's;
  # not an image's version, which differs runner to runner: a record that no longer matches is re-rendered). A shard whose base has a record renders the head alone against it; any
  # difference renders that case fresh (base, head, null test), and the fresh render decides (t1.mjs). Records are
  # saved on a miss (on a branch, for that branch's next push; on main, for every branch) and, on main, the head's, so
  # a branch cut from main's tip finds its base already rendered. Run the gate by hand with t1_cache = verify to prove
  # the records byte for byte a fresh render's.
  # Not when T2 runs for the same head: the 4090 compares the same builds on real hardware, and every job shares the
  # PC's one runner, so SwiftShader's frames would only add an hour of CPU. (T2 offline or not wanted: T1 runs.)
  t1:
    needs: plan
    if: always() && needs.plan.outputs.run_t1 == 'true' && needs.plan.outputs.t2_run != 'true' && needs.plan.outputs.t2_cached == ''
    runs-on: [self-hosted, linux, pc-wsl]
    timeout-minutes: 12
    env:
      T1_CACHE: ${{ inputs.t1_cache || 'use' }}
    # One job, its four shards as four processes side by side: the PC's runners share one CPU, so four jobs rendered
    # no faster than four processes do, and each job waited for a runner of its own (80 s on #157's gate) and set up
    # again (about 13 s). The records stay one per shard, kept together in one cache entry.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/playwright
      - uses: actions/download-artifact@v4
        with:
          name: served
          path: ${{ runner.temp }}/served
      - name: The records' key
        id: rk
        run: echo "pre=t1rec-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/t1.mjs', '.github/ci/harness.mjs', '.github/ci/serve.mjs', '.github/actions/playwright/action.yml') }}-x4" >> "$GITHUB_OUTPUT"
      - name: The base's records, if its build was rendered before
        id: restore
        if: env.T1_CACHE != 'off'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/t1rec
          key: ${{ steps.rk.outputs.pre }}-${{ needs.plan.outputs.base_build }}
      - name: Base against head, four shards side by side
        id: t1
        run: |
          fail=0; pids=()
          for s in 0 1 2 3; do
            node .github/ci/t1.mjs --base "$RUNNER_TEMP/served/base" --head "$RUNNER_TEMP/served/head" --shard $s --shards 4 --out "$RUNNER_TEMP/t1/s$s" \
              --base-rec "$RUNNER_TEMP/t1rec/rec-$s.json" --cache "$T1_CACHE" --save-base-rec "$RUNNER_TEMP/t1new/base-$s.json" --save-head-rec "$RUNNER_TEMP/t1new/head-$s.json" \
              > "$RUNNER_TEMP/t1-s$s.log" 2>&1 &
            pids+=($!)
          done
          for s in 0 1 2 3; do wait ${pids[$s]} || { echo "::error::T1 shard $s failed"; fail=1; }; echo "::group::shard $s"; cat "$RUNNER_TEMP/t1-s$s.log"; echo "::endgroup::"; done
          exit $fail
      # (One cache path for every record: a cache entry is found only under the path it was saved from. Kept only
      # whole: all four shards' records, each saved by t1.mjs only from a run whose null test held.)
      - name: The base's records, staged (a miss)
        id: stage_base
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          for s in 0 1 2 3; do [ -f "$RUNNER_TEMP/t1new/base-$s.json" ] || exit 0; done
          mkdir -p "$RUNNER_TEMP/t1rec"; for s in 0 1 2 3; do cp "$RUNNER_TEMP/t1new/base-$s.json" "$RUNNER_TEMP/t1rec/rec-$s.json"; done; echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Keep the base's records
        if: steps.stage_base.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/t1rec
          key: ${{ steps.rk.outputs.pre }}-${{ needs.plan.outputs.base_build }}
      - name: The head's records, staged (main, a build of its own)
        id: stage_head
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.head_build != needs.plan.outputs.base_build
        run: |
          for s in 0 1 2 3; do [ -f "$RUNNER_TEMP/t1new/head-$s.json" ] || exit 0; done
          rm -rf "$RUNNER_TEMP/t1rec"; mkdir -p "$RUNNER_TEMP/t1rec"; for s in 0 1 2 3; do cp "$RUNNER_TEMP/t1new/head-$s.json" "$RUNNER_TEMP/t1rec/rec-$s.json"; done; echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Keep main's records for the branches that start from it
        if: steps.stage_head.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/t1rec
          key: ${{ steps.rk.outputs.pre }}-${{ needs.plan.outputs.head_build }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-shard-all
          path: ${{ runner.temp }}/t1
          retention-days: 7

  # T2, the RTX 4090 (gpu.yml, on the PC's self-hosted runner): base against head on Direct3D 11, the changed
  # programs read back bit for bit. Wanted when a shader's text or the world's, the realms' or the birds' served JS
  # changed, or T2's own files did (so a change to T2 is tested on its own push). A queued job for a self-hosted runner
  # waits up to a day and cannot be timed out, so the plan job's T2 probe asks GitHub first, in seconds, whether a runner labelled
  # gpu-4090 is online (GET .../actions/runners with MERGE_TOKEN, which has Administration: read). Online: T2 runs and
  # the verdict requires it. Offline, or the query fails: a notice, and the verdict rests on T0 and T1, so T2 never
  # holds a merge for a runner that is not there. The repository variable T2_RUNNER = off skips T2 always (an override).
  # T2 renders the plan's two builds (the `served` artifact): the PC never runs a PR's build.
  # Only after the static checks passed: the 4090 is one runner that every gate's T2 queues for, and a gate whose
  # static checks failed is red whatever T2 says (565 s of its time went to such gates on the night of Nov 11, with 830 s
  # more queued). Static and plan run side by side and take about as long, so T2 starts a few seconds later at most.
  t2:
    needs: [static, plan]
    if: always() && needs.plan.outputs.t2_run == 'true' && needs.static.result == 'success'
    uses: ./.github/workflows/gpu.yml
    with:
      base: ${{ needs.plan.outputs.base }}
      stall: ${{ github.ref == 'refs/heads/main' && 'yes' || 'no' }}   # (the stall visits: main's gate only; the deploy gate reads them)
      frames: ${{ needs.plan.outputs.t2_frames == 'no' && 'no' || 'yes' }}   # (no: the PR's gate already compared these builds' frames)

  # The gate's one answer (verdict.mjs -> the gate-verdict artifact merge.yml reads): gate_ok, frames_identical.
  verdict:
    needs: [static, plan, t1, t2]
    if: ${{ !cancelled() }}   # (a run a newer push cancelled has no verdict: it is not red, it is superseded)
    runs-on: [self-hosted, linux, pc-wsl]
    timeout-minutes: 5
    outputs:
      gate_ok: ${{ steps.v.outputs.gate_ok }}
      frames_identical: ${{ steps.v.outputs.frames_identical }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: t1-shard-*
          path: ${{ runner.temp }}/t1
      - name: Verdict
        id: v
        env:
          NEEDS: ${{ toJSON(needs) }}
          T2_CACHED: ${{ needs.plan.outputs.t2_cached }}
          T1_SHARDS: '4'
        run: node .github/ci/verdict.mjs "$RUNNER_TEMP/t1" "$RUNNER_TEMP/verdict.json"
      - name: T2's answer, kept for the next gate of these builds
        id: t2keep
        if: needs.t2.result == 'success'
        env:
          OUT: ${{ toJSON(needs.t2.outputs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/t2c"; echo "$OUT" | jq -c . > "$RUNNER_TEMP/t2c/t2.json"
          jq -e '.frames_identical == "true" or .frames_identical == "false"' "$RUNNER_TEMP/t2c/t2.json" >/dev/null && echo "ok=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.t2keep.outputs.ok == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true   # (already saved by an earlier run: nothing lost)
        with:
          path: ${{ runner.temp }}/t2c/t2.json
          key: ${{ needs.plan.outputs.t2_key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-verdict
          path: ${{ runner.temp }}/verdict.json
          retention-days: 30
