name: Gate

# The gates every push runs (T0, T1, the verdict), whose verdict merge.yml reads. Pushes that touch only
# .work/** run nothing. A newer push to a branch cancels the run before it (main's runs are never cancelled).
on:
  push:
    branches-ignore: [live]   # (live is only ever fast-forwarded to a main tip, whose own gate already ran)
    paths-ignore: ['.work/**']
  workflow_dispatch:
    inputs:
      t1_cache:
        description: "T1's base records: use (the default), verify (render fresh and prove each record the fresh base's), off"
        type: choice
        options: [use, verify, 'off']
        default: use
      looks:
        description: "The ruler's looks (gate.yml's looks job): measured when looksKey moved (the default), or always"
        type: choice
        options: [moved, always]
        default: moved

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # T0, static: every check of validate.yml (the site's rules, the build, the shaders' guard, W7), as before.
  static:
    uses: ./.github/workflows/validate.yml

  # T0, the plan: which files changed and what they touch (areas.json), whether what is served is byte for byte the
  # base's, and so which gates run. site/ holds only sources: what a visitor gets is the build, so base and head are
  # built here (served.sh: each commit's tools/build.mjs --plain) and compared file by file. The two builds go to the
  # later jobs as this run's artifact gate-served (.github/ci/handoff.mjs's sha256 manifest, pinned by every reader):
  # the census and T1 render exactly these, and nothing builds a PR's code anywhere else (never on the PC).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # (whether the branch has an open PR)
    outputs:
      has_pr: ${{ steps.haspr.outputs.has_pr }}
      base: ${{ steps.base.outputs.base }}
      areas: ${{ steps.areas.outputs.areas }}
      site_changed: ${{ steps.areas.outputs.site_changed }}
      run_t1: ${{ steps.areas.outputs.run_t1 }}
      dom_changed: ${{ steps.areas.outputs.dom_changed }}   # (the page outside the canvas changed)
      served_sha: ${{ steps.handoff.outputs.sha }}   # (the hand-off's manifest, sha256: T1 and the Stills job read the builds pinned to it)
      gpu_js: ${{ steps.areas.outputs.gpu_js }}
      t2_self: ${{ steps.areas.outputs.t2_self }}
      input_changed: ${{ steps.areas.outputs.input_changed }}
      input_files: ${{ steps.areas.outputs.input_files }}
      base_build: ${{ steps.builds.outputs.base }}
      head_build: ${{ steps.builds.outputs.head }}
      glsl_changed: ${{ steps.glsl.outputs.glsl_changed }}
      looks_changed: ${{ steps.looks.outputs.looks_changed }}
      budget: ${{ steps.budget.outputs.budget }}
    steps:
      # A branch with no open PR (a Cloudflare preview, a probe) is not compared: T1 skips and the verdict says it
      # was not compared, so nothing lands on it. On the night of Nov 11 such pushes held the 4090 while six PRs' T2s
      # waited. A session opens its PR seconds after its push, so this asks for up to 45 s. Main and a run by hand are
      # always compared; a PR opened later is compared on its next push (the merge bot's update of the branch is one).
      - name: Is this branch a PR's?
        id: haspr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "push" ]; then echo "has_pr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for i in 1 2 3 4; do
            n=$(curl -fsSL --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" | jq length) || n=error
            if [ "$n" = "error" ]; then echo "the PR query failed: compared as a PR's"; echo "has_pr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$n" -gt 0 ]; then echo "an open PR: compared"; echo "has_pr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            [ $i -lt 4 ] && sleep 15
          done
          echo "::notice::$BRANCH has no open PR: T1 skips (a preview); push again once its PR is open to compare it"; echo "has_pr=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The base (main's tip where this branch left it; on main, main's tip before this push)
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # On main the base is the main tip before this push (the push's `before`): a PR the merge bot fast-forwarded
          # lands with its own branch as first parent, so HEAD^1 would credit main's other changes to it.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            base="$BEFORE"; if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git merge-base --is-ancestor "$base" HEAD; then base=$(git rev-parse HEAD^1); fi
          else base=$(git merge-base origin/main HEAD); fi
          echo "base=$base" >> "$GITHUB_OUTPUT"; echo "base $base, head $GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Base and head, built (what each serves)
        run: bash .github/ci/served.sh ${{ steps.base.outputs.base }} "$RUNNER_TEMP/served"
      - name: Each build's content hash (T1's records are kept by it)
        id: builds
        run: |
          h() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-24); }
          echo "base=$(h "$RUNNER_TEMP/served/base")" >> "$GITHUB_OUTPUT"; echo "head=$(h "$RUNNER_TEMP/served/head")" >> "$GITHUB_OUTPUT"
      # T0, the shader census: whether any shader's text changed, base against head, read from each build in
      # glsl_guard's fake browser (node, five GPUs: .github/ci/glsl-changed.mjs; about 15 s, no Chrome): a report in the
      # verdict (T2, which read the changed programs back on the 4090, is gone with the PC's runners: 2026-11-23).
      - name: The shader census (base against head)
        id: glsl
        run: |
          if [ "${{ steps.builds.outputs.base }}" = "${{ steps.builds.outputs.head }}" ]; then echo "glsl_changed=false (the two builds are byte for byte the same)"; echo "glsl_changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node .github/ci/glsl-changed.mjs "$RUNNER_TEMP/served/base" "$RUNNER_TEMP/served/head"
      # The ruler's key (tools/visit/look-rule.mjs looksKey: the code that lays out the clouds near the words, the opening's
      # view, the words' boxes, the table of first headings and the code that measures them), base against head, each
      # read by the head's look-rule.mjs: the looks job measures the head's frames only when it moved.
      - name: Whether the ruler's looks moved (looksKey, base against head)
        id: looks
        env:
          BASE: ${{ steps.base.outputs.base }}
          FORCE: ${{ inputs.looks || 'moved' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/looks-base" "$BASE" >/dev/null
          k() { node -e "import('./tools/visit/look-rule.mjs').then(async (m) => console.log(await m.looksKey(process.argv[1])))" "$1"; }
          b=$(k "$RUNNER_TEMP/looks-base"); h=$(k "$(pwd)"); git worktree remove --force "$RUNNER_TEMP/looks-base"
          if [ "$b" != "$h" ] || [ "$FORCE" = always ]; then c=true; else c=false; fi
          echo "looksKey: base $b, head $h ($FORCE): looks_changed=$c"; echo "looks_changed=$c" >> "$GITHUB_OUTPUT"
      # Each built script's size against its load budget's line (Brotli 11, as the check weighs it), for the merge bot:
      # a PR near a line is re-gated before it lands on a main that also grew that script (bot-rules.mjs budgetShared)
      - name: The built scripts against their load budgets (for the merge bot)
        id: budget
        run: echo "budget=$(node .github/ci/budget-room.mjs "$RUNNER_TEMP/served/head" "$RUNNER_TEMP/served/base")" >> "$GITHUB_OUTPUT"
      - name: What the change touches
        id: areas
        run: node .github/ci/areas.mjs ${{ steps.base.outputs.base }} "$GITHUB_SHA" --served "$RUNNER_TEMP/served"
      # (2026-11-23) the two builds go to the later jobs as this run's artifact gate-served, kept a day. The repository
      # is public, so Actions storage is not metered (the 2026-11-15 quota, which moved the hand-off onto the PC's disk,
      # was the private repository's). An artifact is scoped to its run: another run's code cannot rewrite it, as it
      # could the PC's shared folder. .github/ci/handoff.mjs still writes the folder (a run and attempt) with its sha256
      # manifest, which every reader checks and pins to this job's output. Its own check is proved on every gate: a byte
      # changed in a copy of the hand-off must be caught.
      - name: The two builds, handed to T1 and the Stills job (the run's artifact gate-served)
        id: handoff   # (outputs.sha: the manifest's sha256, which every reader pins)
        env:
          HANDOFF_ROOT: ${{ runner.temp }}/handoff
        run: |
          node .github/ci/handoff.mjs put "$RUNNER_TEMP/served" served
          node .github/ci/handoff.mjs selftest served
      - uses: actions/upload-artifact@v4
        with:
          name: gate-served
          path: ${{ runner.temp }}/handoff/gate
          retention-days: 1
          include-hidden-files: true   # (.well-known/ is served: the manifest would fail its readers without it)
          if-no-files-found: error

  # T1, the software A/B: base and head served side by side and rendered in the same job (SwiftShader, the clock
  # paused and stepped, frames hashed in the page), a null test (base against base) in every shard. Stills and short
  # stepped sequences at 393x852 at 3 and 1440x900, the split height's device, reduced motion, no WebGL2, the 404
  # page; DOM stills; a CSP-violation listener. Base and head are the plan's two builds. Only when what is served or
  # the harness changed: with the builds byte for byte the same, what a visitor is served is identical by construction.
  # The base is rendered once per build: each shard's record of a build (its frames', DOM's and stills' hashes, errors
  # and CSP reports) is cached by the plain build's content hash (no build.txt in it, so only bytes a visitor gets),
  # the runner's OS, CPU architecture and image (ImageOS: a WSL record is never a hosted runner's) and the harness's
  # files (Chromium and SwiftShader are the pinned Playwright's; not an image's version, which differs runner to
  # runner: a record that no longer matches is re-rendered). A shard whose base has a record renders the head alone against it; any
  # difference renders that case fresh (base, head, null test), and the fresh render decides (t1.mjs). Records are
  # saved on a miss (on a branch, for that branch's next push; on main, for every branch) and, on main, the head's, so
  # a branch cut from main's tip finds its base already rendered. Run the gate by hand with t1_cache = verify to prove
  # the records byte for byte a fresh render's.
  # T1 runs in full, the canvas too (2026-11-23: T2 on the PC's 4090 is gone, the owner's "None on my PC"; this was
  # already the gate whenever the 4090 was offline). t1.mjs --dom-only stays for a GPU check that may come back.
  t1:
    needs: plan
    if: always() && needs.plan.outputs.run_t1 == 'true' && needs.plan.outputs.has_pr != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # (CI lane, 2026-11-24) four runners, a shard each: as four processes on one 4-core runner each shard took 400-435 s
    # (main's gate 45354746204), the gate's longest job. (On the PC's one CPU four jobs rendered no faster than four
    # processes, so it was one job until the hosted runners.) Each shard keeps its own record (its own cache entry) and
    # hands off its own artifact gate-t1-s<N>, its manifest's sha256 its own output sha_<N>: a leg sets only its own, so
    # the four reach the verdict side by side.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: t1 (${{ matrix.shard }}/4)
    outputs:
      sha_0: ${{ steps.shards.outputs.sha_0 }}
      sha_1: ${{ steps.shards.outputs.sha_1 }}
      sha_2: ${{ steps.shards.outputs.sha_2 }}
      sha_3: ${{ steps.shards.outputs.sha_3 }}
    env:
      T1_CACHE: ${{ inputs.t1_cache || 'use' }}
      DOM_ONLY: '0'   # (no T2: T1 owns the canvas)
      S: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/playwright
      - uses: actions/download-artifact@v4
        with: { name: gate-served, path: '${{ runner.temp }}/handoff/gate' }
      - name: The two builds (the plan's hand-off, checked against its manifest, pinned to the plan's output)
        env:
          HANDOFF_SHA: ${{ needs.plan.outputs.served_sha }}
          HANDOFF_ROOT: ${{ runner.temp }}/handoff
        run: node .github/ci/handoff.mjs get served "$RUNNER_TEMP/served" --pinned
      - name: The records' key
        id: rk
        # (the runner's image too, ImageOS: ubuntu24 on GitHub's runners, unset on a self-hosted one, so a record
        # rendered in the PC's WSL is never compared with a hosted runner's frames)
        run: echo "pre=t1rec-v2-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-selfhosted}-${{ hashFiles('.github/ci/t1.mjs', '.github/ci/harness.mjs', '.github/ci/serve.mjs', '.github/actions/playwright/action.yml') }}-x4-s${{ matrix.shard }}" >> "$GITHUB_OUTPUT"
      - name: The base's records, if its build was rendered before
        id: restore
        if: env.T1_CACHE != 'off'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/t1rec
          key: ${{ steps.rk.outputs.pre }}-${{ needs.plan.outputs.base_build }}
      - name: Base against head, this shard
        id: t1
        run: |
          node .github/ci/t1.mjs --base "$RUNNER_TEMP/served/base" --head "$RUNNER_TEMP/served/head" --shard $S --shards 4 --out "$RUNNER_TEMP/t1/s$S" \
            --base-rec "$RUNNER_TEMP/t1rec/rec-$S.json" --cache "$T1_CACHE" --save-base-rec "$RUNNER_TEMP/t1new/base-$S.json" --save-head-rec "$RUNNER_TEMP/t1new/head-$S.json" --dom-only "$DOM_ONLY"
      # (One cache path for the record: a cache entry is found only under the path it was saved from. Each shard's
      # record its own entry (the key ends -s<N>), saved by t1.mjs only from a run whose null test held.)
      - name: The base's record, staged (a miss)
        id: stage_base
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          [ -f "$RUNNER_TEMP/t1new/base-$S.json" ] || exit 0
          mkdir -p "$RUNNER_TEMP/t1rec"; cp "$RUNNER_TEMP/t1new/base-$S.json" "$RUNNER_TEMP/t1rec/rec-$S.json"; echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Keep the base's record
        if: steps.stage_base.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/t1rec
          key: ${{ steps.rk.outputs.pre }}-${{ needs.plan.outputs.base_build }}
      - name: The head's record, staged (main, a build of its own)
        id: stage_head
        if: github.ref == 'refs/heads/main' && needs.plan.outputs.head_build != needs.plan.outputs.base_build
        run: |
          [ -f "$RUNNER_TEMP/t1new/head-$S.json" ] || exit 0
          rm -rf "$RUNNER_TEMP/t1rec"; mkdir -p "$RUNNER_TEMP/t1rec"; cp "$RUNNER_TEMP/t1new/head-$S.json" "$RUNNER_TEMP/t1rec/rec-$S.json"; echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Keep main's record for the branches that start from it
        if: steps.stage_head.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/t1rec
          key: ${{ steps.rk.outputs.pre }}-${{ needs.plan.outputs.head_build }}
      - name: This shard, handed to the verdict (the run's artifact gate-t1-s<N>)
        id: shards   # (outputs.sha_<N>: its manifest's sha256, which the verdict pins)
        if: always()
        env:
          HANDOFF_ROOT: ${{ runner.temp }}/handoff-t1   # (its own folder: the builds downloaded above stay out of the artifact)
        run: |
          if [ -d "$RUNNER_TEMP/t1" ]; then node .github/ci/handoff.mjs put "$RUNNER_TEMP/t1" "t1-s$S" --as "sha_$S"; fi
      - if: always() && steps.shards.outputs[format('sha_{0}', matrix.shard)] != ''
        uses: actions/upload-artifact@v4
        with:
          name: gate-t1-s${{ matrix.shard }}
          path: ${{ runner.temp }}/handoff-t1/gate
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  # The ruler (the hub's ask, 02:09Z Nov 25): each land's first heading keeps the words and the name clear of cloud,
  # measured live in the head's frames (tools/visit/looks.mjs --table --check: the table's headings and each land's own,
  # three of T1's skies and windows, clouds on and off; look-rule.mjs's rule()). No stored record: nothing for another
  # PR to invalidate, nothing to re-measure by hand. Only when the plan's looksKey moved (a cloud near the words, the
  # opening's view, the words' boxes, the table, the measuring code); about 76 s a heading, 30 headings, so eight
  # runners, every 8th land each.
  looks:
    needs: plan
    if: always() && needs.plan.outputs.looks_changed == 'true' && needs.plan.outputs.has_pr != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: looks (${{ matrix.shard }}/8)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund --ignore-scripts   # (terser: the record's worldKey)
      - uses: ./.github/actions/playwright
      - uses: actions/download-artifact@v4
        with: { name: gate-served, path: '${{ runner.temp }}/handoff/gate' }
      - name: The two builds (the plan's hand-off, checked against its manifest, pinned to the plan's output)
        env:
          HANDOFF_SHA: ${{ needs.plan.outputs.served_sha }}
          HANDOFF_ROOT: ${{ runner.temp }}/handoff
        run: node .github/ci/handoff.mjs get served "$RUNNER_TEMP/served" --pinned
      - name: The ruler, this shard's lands
        run: node tools/visit/looks.mjs --build "$RUNNER_TEMP/served/head" --table --check --shard ${{ matrix.shard }}/8 --jobs 2 --out "$RUNNER_TEMP/looks/looks-s${{ matrix.shard }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looks-s${{ matrix.shard }}   # (the record, for headings.mjs: never committed)
          path: ${{ runner.temp }}/looks
          retention-days: 7
          if-no-files-found: ignore

  # The gate's one answer (verdict.mjs -> the gate-verdict artifact merge.yml reads): gate_ok, frames_identical.
  # The first paint, base against head (load-perf, 2026-11-25; the hub's trend check): the plan's two builds opened cold
  # in the gates' headless Chromium on the real clock, base and head in turn, 9 loads an arm (tools/paint-trend.mjs).
  # It fails when the head's median words (the first contentful paint) or world (the world's first shown frame) is
  # slower than the base's by more than max(50 ms, 3 x the noise it measures). Only when what is served changed: a
  # byte-identical build cannot be slower (skipped, which the verdict counts as green).
  # (CI lane, 2026-11-25, the hub's gate p90) three runners, 3 loads an arm each, side by side (18 loads on one runner took
  # 231-292 s, the gate's pole in 38% of its runs); `paint` pools them (paint-trend.mjs --judge: each runner's loads centred
  # on its own median, so a faster runner moves both arms alike) and is the job the verdict reads.
  paint-loads:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.site_changed == 'true' && needs.plan.outputs.has_pr != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: paint-loads (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/playwright
      - uses: actions/download-artifact@v4
        with: { name: gate-served, path: '${{ runner.temp }}/handoff/gate' }
      - name: The two builds (the plan's hand-off, checked against its manifest, pinned to the plan's output)
        env:
          HANDOFF_SHA: ${{ needs.plan.outputs.served_sha }}
          HANDOFF_ROOT: ${{ runner.temp }}/handoff
        run: node .github/ci/handoff.mjs get served "$RUNNER_TEMP/served" --pinned
      - name: The first paint, base against head, this runner's loads
        run: node tools/paint-trend.mjs "$RUNNER_TEMP/served/base" "$RUNNER_TEMP/served/head" --runs 3 --samples "$RUNNER_TEMP/paint/s${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: paint-s${{ matrix.shard }}
          path: ${{ runner.temp }}/paint
          retention-days: 1
          if-no-files-found: error

  paint:
    needs: [plan, paint-loads]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.site_changed == 'true' && needs.plan.outputs.has_pr != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            .github/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with: { pattern: 'paint-s*', merge-multiple: true, path: '${{ runner.temp }}/paint' }
      - name: The first paint, base against head (the three runners' loads pooled)
        run: |
          n=$(ls "$RUNNER_TEMP"/paint/s*.json 2>/dev/null | wc -l)
          [ "$n" = 3 ] || { echo "::error::$n of 3 paint runners reported"; exit 1; }
          node tools/paint-trend.mjs --judge "$RUNNER_TEMP"/paint/s*.json --json "$RUNNER_TEMP/paint.json"

  verdict:
    needs: [static, plan, t1, looks, paint]
    if: ${{ !cancelled() }}   # (a run a newer push cancelled has no verdict: it is not red, it is superseded)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate_ok: ${{ steps.v.outputs.gate_ok }}
      frames_identical: ${{ steps.v.outputs.frames_identical }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
      - if: needs.t1.outputs.sha_0 != '' || needs.t1.outputs.sha_1 != '' || needs.t1.outputs.sha_2 != '' || needs.t1.outputs.sha_3 != ''
        uses: actions/download-artifact@v4
        with: { pattern: 'gate-t1-s*', merge-multiple: true, path: '${{ runner.temp }}/handoff/gate' }
      - name: T1's shards (each shard's hand-off, checked and pinned to its own leg's output; none when T1 did not run)
        env:
          SHA_0: ${{ needs.t1.outputs.sha_0 }}
          SHA_1: ${{ needs.t1.outputs.sha_1 }}
          SHA_2: ${{ needs.t1.outputs.sha_2 }}
          SHA_3: ${{ needs.t1.outputs.sha_3 }}
          HANDOFF_ROOT: ${{ runner.temp }}/handoff
        run: |
          mkdir -p "$RUNNER_TEMP/t1"
          for n in 0 1 2 3; do
            v="SHA_$n"; if [ -z "${!v}" ]; then echo "no hand-off from T1 shard $n"; continue; fi
            HANDOFF_SHA="${!v}" node .github/ci/handoff.mjs get "t1-s$n" "$RUNNER_TEMP/t1/$n" --pinned
          done
      - name: Verdict
        id: v
        env:
          NEEDS: ${{ toJSON(needs) }}
          T1_SHARDS: '4'
        run: node .github/ci/verdict.mjs "$RUNNER_TEMP/t1" "$RUNNER_TEMP/verdict.json"
      # the verdict: the small gate-verdict artifact, what the merge bot and the Stills job (its served_sha
      # pins the builds) read. Its upload fails the job: without it nothing can trust this run's answer.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-verdict
          path: ${{ runner.temp }}/verdict.json
          retention-days: 30
