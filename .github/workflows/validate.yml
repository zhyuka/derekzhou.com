name: Validate

# Run by the gate (gate.yml's static job, on every push), or by hand. Not on its own triggers, so its minutes are spent once.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The readable scripts, assembled
        run: |
          # (restructure step 1) src/ keeps the world and the ink birds as small section files (src/world/,
          # src/birds/inkbirds/: NNN-slug.js, joined in name order, nothing between). build/src/ is src/ assembled,
          # the whole readable scripts under their served names: what every step below reads. Never committed.
          # (step 2) build/ship/ is the shipped build: the dev-only parts (src/dev/: the record, the harness) left out
          # by file, each stub in its place. minify.mjs minifies that; the start file is made from build/src/.
          node tools/parts.mjs assemble src build/src
          node tools/parts.mjs assemble --ship src build/ship

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The site, built (what every check of a served file reads)
        run: |
          # site/ holds only sources: the pages, _headers, the hand-written scripts, the fonts. The files the build
          # writes (the five minified scripts from build/ship/, the start file and its table from build/src/) are
          # never committed. build/site/ is the plain build (tools/build.mjs --plain: the vN names), byte for byte
          # what Cloudflare Pages serves before it names each script by its content. terser as package.json pins it.
          npm ci --no-audit --no-fund --ignore-scripts
          node tools/build.mjs --plain build/site > /dev/null

      - name: Check required files exist
        run: |
          # The site is built from the folder site/ (tools/build.mjs; Cloudflare Pages serves the build): every file
          # it serves is in the build (build/site/), and nothing of the repository's own (CLAUDE.md, .github/, the
          # font scripts) is in site/.
          cd site
          files=(
            index.html
            style.css
            site.js
            hour.js
            start.js
            start-table.js
            world.js
            realm-kit.js
            realm-dunes.js
            realm-above.js
            facetform.js
            facetpose.js
            wingmodel.js
            model.js
            labbird.js
            birdwing.js
            inkbirds.js
            robots.txt
            _headers
            _redirects
            404.html
            assets/favicon.png
            assets/favicon.svg
            assets/apple-touch-icon.png
            assets/fonts/Geist-400-500.sub2.woff2
            assets/fonts/GeistMono-Regular.sub2.woff2
            assets/fonts/OFL.txt
            .well-known/security.txt
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "../build/site/$f" ]; then
              echo "MISSING: $f (not in the build)"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          # site/ holds only the kinds of file the site serves (pages, styles, scripts, fonts, images, robots.txt,
          # security.txt, the fonts' licence, Pages' _headers, _redirects, _routes.json), at any depth; the
          # repository's root holds only its own (.github/, .gitignore, CLAUDE.md, the font scripts, site/, and a
          # functions/ folder, where Pages looks for one). A new kind of file is a deliberate change to these lists.
          while IFS= read -r f; do
            case "$f" in
              */.git/*|*/.github/*|./.git|./.gitignore) echo "::error::site/${f#./} is the repository's own: it would be served"; missing=1; continue ;;
            esac
            case "$f" in
              *.html|*.css|*.js|*.woff2|*.png|*.svg|./robots.txt|./.well-known/security.txt|./assets/fonts/OFL.txt|./_headers|./_redirects|./_routes.json) ;;
              *) echo "::error::site/${f#./} is not a kind of file the site serves (the repository's own files stay outside site/)"; missing=1 ;;
            esac
          done < <(find . -type f | sort)
          for f in ../* ../.[!.]*; do
            [ -e "$f" ] || continue
            case "${f#../}" in
              .git|.github|.gitignore|CLAUDE.md|download-fonts.sh|subset-fonts.sh|site|functions) ;;
              .gitattributes|package.json|package-lock.json|node_modules|src|tools|build|test) ;;
              RULES.json|.claude|docs) ;;   # (docs/: the full record, one file per area, CLAUDE.md the short version)   # (the standing rules as data, and the project's hooks: never served)   # (the build: src/ the readable scripts, in parts; build/ src/ assembled (tools/parts.mjs); tools/minify.mjs, terser pinned; node_modules only after npm ci)
              *) echo "::error::${f#../} is at the repository's root: what the site serves goes in site/ (or add it to the root's list here)"; missing=1 ;;
            esac
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: No secrets in code
        run: |
          # Scan for common secret patterns in tracked files
          patterns=(
            'AKIA[0-9A-Z]{16}'
            'sk-[a-zA-Z0-9]{20,}'
            'ghp_[a-zA-Z0-9]{36}'
            'password\s*[:=]\s*["\x27][^"\x27]{8,}'
          )
          found=0
          for pattern in "${patterns[@]}"; do
            if grep -rEn "$pattern" --include='*.html' --include='*.css' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.md' --include='*.txt' . 2>/dev/null | grep -v node_modules; then
              echo "POTENTIAL SECRET found matching: $pattern"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Potential secrets detected in source files"
            exit 1
          fi
          echo "No secrets found"

      - name: The rules are data, and the hooks hold
        run: |
          # RULES.json is every standing rule as data: valid, ids unique, and every CI step, world_rules.py rule,
          # absence block and hook it names exists. Then the project's hooks (.claude/hooks/guard.py: no push to main,
          # no force push, no merge, no banned name) pass their own tests, and no tracked file holds a banned name.
          python3 .github/workflows/rules_check.py
          python3 .claude/hooks/test_guard.py
          python3 .claude/hooks/guard.py --scan   # (no tracked file holds a banned name: names.json's salted hashes)

      - name: security.txt not expired
        run: |
          exp=$(grep -oP 'Expires: \K.*' site/.well-known/security.txt)
          if [ "$(date -d "$exp" +%s)" -le "$(date +%s)" ]; then
            echo "::error::security.txt Expires ($exp) is in the past — update it"
            exit 1
          fi
          echo "security.txt valid until $exp"

      - name: Asset references must resolve (immutable-rename integrity)
        run: |
          cd build/site
          # Changed bytes require renamed files; this catches a rename that
          # missed a reference. Every local href/src in the HTML and every
          # path in _headers Link/cache rules must exist in the site.
          fail=0
          refs=$(grep -ohE '(href|src)="/[^"#]+"' index.html 404.html | sed -E 's/^(href|src)="//; s/"$//')
          refs="$refs $(grep -oE 'Link: <[^>]+>' _headers | sed -E 's/Link: <//; s/>//')"
          refs="$refs $(grep -oE '^/[A-Za-z0-9._-]+\.(css|js|woff2|svg|png)$' _headers)"
          for ref in $refs; do
            if [ ! -f ".${ref}" ]; then
              echo "::error::Reference $ref does not exist as a file"
              fail=1
            else
              echo "OK: $ref"
            fi
          done
          # And the reverse: the css/js the page loads by name must be the
          # ones index.html loads, each with its immutable cache block (a
          # leftover old version, kept by a copy rather than a git mv, fails).
          for f in style.css hour.js start.js world.js realm-*.js facetform.js facetpose.js wingmodel.js model.js labbird.js birdwing.js inkbirds.js; do
            if [ -f "$f" ] && ! grep -q "\"/$f\"" index.html; then
              echo "::error::$f exists but index.html does not reference it"
              fail=1
            fi
            if [ -f "$f" ] && ! grep -qx "/$f" _headers; then
              echo "::error::$f has no immutable cache block in _headers"
              fail=1
            fi
          done
          # Every script and stylesheet anywhere in the site is one the pages
          # load (nothing left over from the world's development build: no
          # diagnostics, no lab, no test realm). (Their names need no version:
          # the deploy build serves each under its content's hash, tools/build.mjs.)
          for f in $(find . -type f \( -name '*.js' -o -name '*.css' \) | sed 's|^\./||' | sort); do
            if ! grep -qE "(src|href)=\"/$f\"" index.html 404.html && ! { case "$f" in plan.js) grep -q "new Worker(./$f.)" world.js;; start-table.js) grep -qF "new Worker('/$f')" start.js;; *) false;; esac; }; then   # (fast500 step 11: the plan's worker is loaded by the world, by name)
              echo "::error::$f is shipped but no page loads it"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All references resolve"
          exit $fail

      - name: No inline code on CSP'd pages
        run: |
          cd build/site
          # The site-wide CSP has no unsafe-inline; inline styles, style
          # blocks, and inline event handlers silently do nothing. Fail
          # fast instead. (JSON-LD script blocks are exempt from
          # script-src and allowed.)
          if grep -niE 'style[[:space:]]*=[[:space:]]*"|<style|[[:space:]]on[a-z]+[[:space:]]*=[[:space:]]*"' index.html 404.html; then
            echo "::error::Inline style/handler found — blocked by CSP"
            exit 1
          fi
          # and no inline script but the JSON-LD block
          if grep -nE '<script(>|[[:space:]][^>]*>)' index.html 404.html | grep -vE 'src="/|type="application/ld\+json"'; then
            echo "::error::Inline script found — blocked by CSP"
            exit 1
          fi
          echo "No inline code"

      - name: The lettered name keeps its words
        run: |
          cd build/site
          # The h1 is drawn (one SVG path in the words' colour) but must still
          # read "Derek Zhou" to every reader: its words in a visually hidden
          # span, the drawing hidden from assistive tech and inert (no text,
          # script, style, link or paint server inside it), the stylesheet
          # holding both rules and reserving the drawing's box (no layout shift).
          CSS=style.css
          python3 - "$CSS" <<'PY'
          import re, sys
          html = open('index.html').read(); css = open(sys.argv[1]).read()
          fail = 0
          m = re.search(r'<h1 class="name">(.*?)</h1>', html, re.S)
          if not m:
              print('::error::index.html has no <h1 class="name">'); sys.exit(1)
          h1 = m.group(1)
          if '<span class="visually-hidden">Derek Zhou</span>' not in h1:
              print('::error::the h1 lost its words: <span class="visually-hidden">Derek Zhou</span>'); fail = 1
          svg = re.search(r'<svg\b([^>]*)>(.*?)</svg>', h1, re.S)
          if not svg:
              print('::error::the h1 has no lettering (svg)'); sys.exit(1)
          attrs, body = svg.groups()
          for need in ['aria-hidden="true"', 'focusable="false"', 'viewBox="']:
              if need not in attrs:
                  print('::error::the lettering svg lacks', need); fail = 1
          if len(re.findall(r'<path\b', body)) != 1 or 'fill="currentColor"' not in body:
              print('::error::the lettering must be one path filled with currentColor'); fail = 1
          if re.search(r'<(text|script|style|a|image|use|foreignObject|linearGradient|radialGradient|pattern|filter)\b|\bstyle=|href=|\bon[a-z]+=', body, re.I):
              print('::error::the lettering holds more than its drawing'); fail = 1
          vb = re.search(r'viewBox="0 0 ([\d.]+) ([\d.]+)"', attrs)
          ar = re.search(r'\.name svg\s*\{[^}]*aspect-ratio:\s*([\d.]+)\s*/\s*([\d.]+)', css)
          if not vb or not ar or abs(float(vb.group(1)) / float(vb.group(2)) - float(ar.group(1)) / float(ar.group(2))) > 1e-6:
              print('::error::the stylesheet must reserve the lettering box (.name svg aspect-ratio = the viewBox\'s)'); fail = 1
          if not re.search(r'\.visually-hidden\s*\{[^}]*clip-path:\s*inset\(50%\)', css):
              print('::error::the stylesheet has no .visually-hidden rule'); fail = 1
          print('the lettered name keeps its words' if not fail else 'FAILED'); sys.exit(fail)
          PY

      - name: The page says what it says
        run: |
          cd build/site
          # The words on the page and in its search and share text, exactly:
          # the line under the name (in its own span), the credit,
          # the two links and the noscript address; the JSON-LD's role.
          python3 - <<'PY'
          import html as H, json, re, sys
          src = open('index.html', encoding='utf-8').read()
          LINE = 'Hands-on technology leader in Agentic and Generative AI, Platform Engineering, and Product Development.'
          def text(s): return re.sub(r'\s+', ' ', H.unescape(re.sub(r'<[^>]+>', '', s)).replace(' ', ' ').replace('⁠', '')).strip()
          fail = 0
          def need(ok, what):
              global fail
              if not ok: print('::error::' + what); fail = 1
          m = re.search(r'<p class="words"><span>(.*?)</span></p>', src, re.S)
          need(m and text(m.group(1)) == LINE, 'the line under the name must read "%s" in <p class="words"><span>' % LINE)
          m = re.search(r'<p class="credit">(.*?)</p>', src, re.S)
          need(m and text(m.group(1)) == 'Team Lead · Accenture Song · 2022 – Now', 'the credit must read "Team Lead · Accenture Song · 2022 – Now"')
          need('<a href="#" id="email-link" aria-label="Send email to Derek Zhou">Email</a>' in src, 'the Email link changed')
          need('<a href="https://www.linkedin.com/in/derek-z" rel="me" aria-label="Derek Zhou on LinkedIn">LinkedIn</a>' in src, 'the LinkedIn link changed')
          need('<noscript><p class="noscript-email">hello&#64;derekzhou&#46;com</p></noscript>' in src, 'the noscript address changed')
          need('<title>Derek Zhou &mdash; Technology Leader</title>' in src, 'the title changed')
          need('<meta name="description" content="Derek Zhou is a hands-on technology leader in Agentic and Generative AI, Platform Engineering, and Product Development.">' in src, 'the meta description changed')
          for p in ['og:description', 'twitter:description']:
              need(re.search(r'<meta (?:property|name)="%s" content="%s">' % (p, re.escape(LINE)), src), p + ' must be the line')
          ld = json.loads(re.search(r'<script type="application/ld\+json">(.*?)</script>', src, re.S).group(1))
          need(ld.get('jobTitle') == 'Team Lead' and ld.get('sameAs') == ['https://www.linkedin.com/in/derek-z'], 'the JSON-LD role or sameAs changed')
          print('the words are the page\'s own' if not fail else 'FAILED'); sys.exit(fail)
          PY

      - name: The world's page loads in order
        run: |
          cd build/site
          # hour.js in the head (before the first paint), site.js, then the
          # deferred scripts in order: the world, the realms' kit and realms,
          # fetchpriority="high" (the boot starts once the realms register),
          # then the ink birds' wing model and the ink birds last, fetchpriority="low".
          # Every script data-cfasync="false", so Rocket Loader leaves the
          # order as served. One canvas, in the HTML; no bird SVGs.
          python3 - <<'PY'
          import re, sys
          src = open('index.html', encoding='utf-8').read()
          head, body = src.split('<body>', 1)
          tags = lambda s: re.findall(r'<script\b([^>]*)\bsrc="/([^"]+)"([^>]*)></script>', s)
          want_head = [('hour', False)]
          want_body = [('site', False), ('world', True), ('realm-kit', True), ('realm-dunes', True), ('realm-above', True), ('facetform', True), ('facetpose', True), ('wingmodel', True), ('model', True), ('labbird', True), ('birdwing', True), ('inkbirds', True)]
          pri = {'world': 'high', 'realm-kit': 'high', 'realm-dunes': 'high', 'realm-above': 'high', 'facetform': 'low', 'facetpose': 'low', 'wingmodel': 'low', 'model': 'low', 'labbird': 'low', 'birdwing': 'low', 'inkbirds': 'low'}
          fail = 0
          # (fast500 5) the start file (start.js, made by tools/start.mjs): async, fetchpriority="high", the first
          # script after the canvas, and the only async script; the order below is the rest's
          stf = [g for g in tags(body) if re.fullmatch(r'start(?:\.v\d+)?\.js', g[1])]
          asyn = [g for g in tags(src) if 'async' in (g[0] + g[2]).split()]
          if asyn != stf or len(stf) > 1:
              print('::error::the only async script is the one start file: got %s' % [g[1] for g in asyn]); fail = 1
          for g in stf:
              at = (g[0] + g[2]).split()
              if 'defer' in at or re.findall(r'\bfetchpriority="(\w+)"', g[0] + g[2]) != ['high'] or 'data-cfasync="false"' not in at:
                  print('::error::%s wants async, fetchpriority="high" and data-cfasync="false", never defer' % g[1]); fail = 1
              if not re.search(r'<canvas class="sky" aria-hidden="true"></canvas>\s*(<!--[^>]*-->\s*)?<script\b[^>]*\bsrc="/' + re.escape(g[1]) + '"', body):
                  print('::error::%s must come right after the canvas' % g[1]); fail = 1
          for part, want in [(head, want_head), (body, want_body)]:
              got = [g for g in tags(part) if g not in stf]
              names = [(re.sub(r'(\.v\d+)?\.js$', '', g[1]), 'defer' in (g[0] + g[2]).split()) for g in got]
              if names != want:
                  print('::error::scripts out of order: got %s, want %s' % (names, want)); fail = 1
              for g in got:
                  if 'data-cfasync="false"' not in g[0] + g[2]:
                      print('::error::%s lacks data-cfasync="false"' % g[1]); fail = 1
                  st = re.sub(r'(\.v\d+)?\.js$', '', g[1])
                  if part is body and st in pri and re.findall(r'\bfetchpriority="(\w+)"', g[0] + g[2]) != [pri[st]]:
                      print('::error::%s wants fetchpriority="%s"' % (g[1], pri[st])); fail = 1
          if body.count('<canvas class="sky" aria-hidden="true"></canvas>') != 1:
              print('::error::the page needs its one canvas.sky'); fail = 1
          if re.search(r"""class=["'][^"']*\bbird\b|<polyline""", src):   # (a bird class in any class list, in either quotes, or a stroke)
              print('::error::the old 2D birds are retired: no bird SVG in the page'); fail = 1
          print('in order' if not fail else 'FAILED'); sys.exit(fail)
          PY

      - name: Absences are enforced
        run: |
          cd build/site
          # (the world's five scripts as written, ../src/ (src/ assembled): site/ serves them minified, and "The minified scripts are
          # exactly what the script makes" proves site/'s are tools/minify.mjs's build of these; the rules read text)
          WORLD=../src/world.js; INK=../src/inkbirds.js
          REALMS=$(ls ../src/realm-*.js | tr '\n' ' '); HOUR=hour.js; CSS=style.css
          START=$(ls start.js 2>/dev/null | head -1)   # (fast500 5: served as tools/start.mjs makes it, readable)
          START="$START $(ls start-table.js 2>/dev/null | head -1)"   # (its table, start-table.js, loaded after the first paint)
          WING=$(ls facetform.js facetpose.js wingmodel.js model.js labbird.js birdwing.js | tr '\n' ' ')   # (the ink birds' wing model, round 3: served as written, not minified)
          PLANW=$(ls plan.js 2>/dev/null | head -1)   # (fast500 step 11: the plan's worker, held to the same absences)
          JS="site.js $HOUR $START $WORLD $REALMS $WING $INK $PLANW"
          echo "checking $JS and $CSS"
          # The page has none of the internet's body language, and CI fails
          # (rather than remembers) if any of it comes back. Scoped to the
          # shipped files only — never to CLAUDE.md prose.
          fail=0
          # (1) chrome: arrows, cookie/analytics vocabulary, loading states, nav roles
          if grep -nE '&rarr;|→|cookie|analytics|gtag|Loading|role="navigation"' index.html 404.html; then
            echo "::error::internet body language found in the HTML"
            fail=1
          fi
          # (2) behaviour: no exit, idle, hover-position, key or title handlers, no storage; the one exception the
          # birds' pointer play (the owner, 2026-11-05: "the birds should be more interactive with the mouse"): the
          # world's onHoverOut, a pointerout added and removed in hoverSync only (checked below)
          if grep -nE 'beforeunload|[^a-z]unload|mouseleave|mouseout|mouseover|mouseenter|pointerover|pointerenter|pointerleave|pointerout|onblur|\bblur\(|document\.title|rel="icon"|mousemove|keydown|keyup|keypress|IdleDetector|sessionStorage|localStorage|indexedDB|document\.cookie' $JS | grep -vE "addEventListener\('pointerout', onHoverOut, \{ capture: true, passive: true \}\)|removeEventListener\('pointerout', onHoverOut, \{ capture: true, passive: true \}\)"; then
            echo "::error::a needy behaviour (exit/idle/title/pointer handler or storage) was introduced"
            fail=1
          fi
          # a pointer's moves are read by the world alone: the drag's (onMove, added in onDown, removed in endDrag)
          # and the birds' play's (onHover, passive, and onHoverOut, the pointer off the window: both added and
          # removed in hoverSync only, the owner's 2026-11-05 request); no other file reads them
          python3 - "$WORLD" $JS <<'PY' || fail=1
          import re, sys
          world, files = sys.argv[1], sys.argv[2:]
          bad = 0
          for f in files:
              s = open(f, encoding='utf-8').read()
              n = s.count('pointermove')
              if f != world and n:
                  print('::error::%s reads pointer moves' % f); bad = 1
              if f == world:
                  def body(name):
                      m = re.search(r'\n  function %s\(.*?\n  function ' % name, s, re.S)
                      return m.group(0) if m else ''
                  if n != 4 or "window.addEventListener('pointermove', onMove, true)" not in body('onDown') or "window.removeEventListener('pointermove', onMove, true)" not in body('endDrag'):
                      print('::error::%s: pointer moves must be read only during a drag (added in onDown, removed in endDrag) and by the birds\' play (hoverSync)' % f); bad = 1
                  hs = body('hoverSync'); o = "%sEventListener('%s', %s, { capture: true, passive: true })"
                  if s.count('pointerout') != 2 or any((o % (a, e, h)) not in hs for a in ('window.add', 'window.remove') for e, h in (('pointermove', 'onHover'), ('pointerout', 'onHoverOut'))):
                      print('::error::%s: the birds\' pointer play: onHover (pointermove) and onHoverOut (pointerout), passive, added and removed in hoverSync only' % f); bad = 1
          sys.exit(bad)
          PY
          # (3) the scripts add no DOM: the canvas, the stack and the lettering are in index.html
          if grep -nE 'createElement|innerHTML|outerHTML|insertAdjacentHTML|appendChild|insertBefore|replaceChildren|document\.write' $JS; then
            echo "::error::DOM built in script — the canvas and every element live in index.html"
            fail=1
          fi
          # (4) the weather (=rand()): ONE entropy read, in the world, above
          # INIT-END; no clock but the hour's one read and the world's
          # one clockNow (performance.now, for budgets: above INIT-END); never
          # Math.random. The realms and the ink birds draw from the world's streams
          # and read no clock at all.
          for f in $WORLD; do
            if [ "$(grep -o 'getRandomValues(' $f | wc -l)" != "1" ]; then
              echo "::error::$f must draw entropy exactly once (getRandomValues( count != 1)"
              fail=1
            fi
            if grep -nE 'Math\.random|\bDate\b|randomUUID' $f; then
              echo "::error::Math.random or a clock read in $f — the only randomness is the visit seed"
              fail=1
            fi
            if ! grep -q -- '---- INIT-END:' $f; then
              echo "::error::INIT-END marker missing from $f"
              fail=1
            fi
            bad=$(awk '/---- INIT-END:/{p=1;next} p && /getRandomValues|Math\.random|Date|randomUUID|performance\.now/{print NR": "$0}' $f)
            if [ -n "$bad" ]; then
              echo "$bad"
              echo "::error::an entropy or clock read below the INIT-END marker in $f"
              fail=1
            fi
          done
          if [ "$(grep -o 'performance\.now()' $WORLD | wc -l)" != "1" ]; then
            echo "::error::$WORLD must call performance.now() exactly once (its clockNow)"
            fail=1
          fi
          if grep -nE 'getRandomValues|Math\.random|Date|randomUUID|performance\.now' $REALMS $WING $INK $START $PLANW; then
            echo "::error::the realms, the wing model, the ink birds and the start file draw no entropy and read no clock"
            fail=1
          fi
          # the hour reads the clock exactly once, and draws no entropy
          if [ "$(grep -o 'new Date(' $HOUR | wc -l)" != "1" ] || [ "$(grep -oE '\bDate\b' $HOUR | wc -l)" != "1" ] || grep -nE 'Math\.random|getRandomValues|randomUUID|performance\.now' $HOUR; then
            echo "::error::$HOUR must read the clock exactly once (new Date) and nothing else"
            fail=1
          fi
          # (5) no URL hook, no sound, no network, no custom cursor
          if grep -nE '\blocation\.|document\.URL|document\.referrer|URLSearchParams|new Audio\(|AudioContext|<audio|speechSynthesis' $JS index.html 404.html; then
            echo "::error::a URL hook or sound was introduced"
            fail=1
          fi
          # (fast500 step 11) the workers: the plan's, started by the world by its literal name (world_rules.py rule 2b),
          # and the start file's table (start-table.js, started by the start file by its literal name, rule 4b); no other
          NW=$(cat $JS | grep -o 'new Worker(' | wc -l); NP=$(grep -oE "new Worker\(./plan\.js.\)" $WORLD | wc -l); NS=$(cat $(ls start.js 2>/dev/null) /dev/null | grep -oE "new Worker\('/start-table\.js'\)" | wc -l)
          if [ "$NW" != "$((NP + NS))" ] || [ "$NP" -gt 1 ] || [ "$NS" -gt 1 ]; then
            echo "::error::a worker other than the plan's (the world starts plan.js by name, once) and the start file's table (start-table.js, once)"
            fail=1
          fi
          if grep -nE 'fetch\(|XMLHttpRequest|WebSocket|sendBeacon|EventSource|importScripts|\beval\(|new Function' $JS; then
            echo "::error::the scripts fetch nothing and run no code but their own"
            fail=1
          fi
          if grep -nE 'cursor *:' $CSS; then
            echo "::error::a cursor rule in $CSS — OS cursors only"
            fail=1
          fi
          # (6) no dev or record hooks (the development harness stays out): nothing put
          # on or read from window.__*, no console, and of the attributes on <html>
          # the scripts read only the hour's data-sky and data-sky-at
          if grep -nE 'window\.__|window\.claude|\bconsole\.' $JS; then
            echo "::error::a dev hook, a record or a console call in the shipped scripts"
            fail=1
          fi
          python3 - $JS <<'PY' || fail=1
          import re, sys
          ok = {'data-sky', 'data-sky-at', 'src'}
          bad = 0
          for f in sys.argv[1:]:
              s = open(f, encoding='utf-8').read()
              for m in re.finditer(r'\b(attr|getAttribute|hasAttribute)\(\s*([^)]*?)\)', s):
                  arg = m.group(2).strip()
                  lit = re.fullmatch(r"'([^']*)'|\"([^\"]*)\"", arg)
                  if lit:
                      name = lit.group(1) or lit.group(2)
                      if name not in ok:
                          print('::error::%s reads the attribute %s' % (f, name)); bad = 1
                  elif not (m.group(0) in ('attr(n)', 'getAttribute(n)') and 'function attr(n) { return root.getAttribute(n); }' in s):
                      print('::error::%s reads an attribute by a computed name: %s' % (f, m.group(0))); bad = 1
              if re.search(r'\.dataset\b', s):
                  print('::error::%s reads data attributes through dataset' % f); bad = 1
          sys.exit(bad)
          PY
          # (7) the old 2D birds are retired (the ink birds, in the world, are the birds): no birds.vN.js served or in
          # src/ (compgen, no pipeline: the same in either shell, bash -e or -eo pipefail), no bird SVG or script in the
          # pages or the headers (a bird class in either quotes, in any class list), no .bird rule or [class=bird]
          # selector, nothing naming their hand-over (window.skyAir, the world's SKYAIR, handTo, HASSVG, DISSOLVE_S, the
          # record's boot wait and hand-over fields)
          if compgen -G 'birds.v*.js' > /dev/null || compgen -G '../src/birds.v*.js' > /dev/null \
            || grep -nE "class=[\"'][^\"']*\\bbird\\b|<polyline|(^|[^a-z-])birds\\.v[0-9]+\\.js" index.html 404.html _headers \
            || grep -nE "\\.bird([^a-zA-Z0-9_-]|\$)|\\[class[~*^|\$]?=[\"']?bird\\b" $CSS \
            || grep -nE '\b(skyAir|SKYAIR|handTo|HASSVG|DISSOLVE_S|bootWaitWhy|handoverToldMs|handover)\b' $JS; then
            echo "::error::the old 2D birds are retired: their script, SVGs, CSS or hand-over came back"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "All absences hold"
          exit $fail

      - name: The build, the same bytes every time; site/ holds no built file
        run: |
          # tools/build.mjs is the site's build in one command (site/ copied, the built scripts written over it:
          # tools/minify.mjs, terser as package.json pins it (the lockfile's hashes), the record and the dev harness
          # left out of the world by file, every shader's text the same). Built twice at once into two folders: both
          # must be the same bytes, and site/ must hold none of the files the build writes (they are never
          # committed: their sources are in src/). Whether a change alters a served byte is the gate's plan job
          # (the base's build against the head's). (step 5) Then the deploy build, made from each: every
          # script and stylesheet named by its content (world.<sha8>.js), every reference rewritten; the same from
          # both, every name its bytes' hash, no old name left, every reference resolving, each file immutable.
          node tools/build.mjs --check

      - name: Set up Python (the wing model's generators)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: The wing model is what its generators make
        run: |
          # Two of src/birds/model/'s scripts are generated, never edited by hand: facetform.js (the faceted M, by
          # tools/birds/form/mkform.py) and model.js (the measured wingbeat, by tools/birds/model/make.py from the
          # data in tools/birds/model/data/ and settings.json; with model_full.json, every number's notes, kept
          # beside it and never served). Both are made again here and must be the committed files byte for byte, so
          # a generated file can never drift from its source. numpy (BSD) pinned: the version they were made with.
          python -m pip install --quiet --disable-pip-version-check numpy==2.5.3
          python -I tools/birds/form/mkform.py build/facetform.js > /dev/null
          if ! cmp -s build/facetform.js src/birds/model/facetform.js; then
            echo "::error::src/birds/model/facetform.js is not what tools/birds/form/mkform.py makes (run it and commit the result)"
            exit 1
          fi
          python -I tools/birds/model/make.py --check

      - name: The world's pure code, unit-tested
        run: |
          # test/unit.mjs (restructure step 6, about 10 s): the world's code that runs without a page, read from the
          # dev build by its own anchors (src/ exports nothing for it): the streams and integer hashes (values,
          # ranges, spread), the sky order's rules (the landing sky the hour's, never one of the last few, near unless
          # far, every sky seen), the maps and the kit weights (in [0, 1]; the same plan and flight from the same seed),
          # and the plan's worker against the page's own plan, hash for hash. Golden values in test/golden/unit.json:
          # after a deliberate change, node test/unit.mjs --write, committed with it.
          node --test test/unit.mjs

      - name: The world's rules
        run: |
          # Every script tagged for Rocket Loader; production blind (every home-scope
          # CSP lets in Cloudflare Web Analytics' two origins and nothing else, no
          # diagnostics, control or lab page);
          # the world's files' absences (DOM, URL hooks, storage, sound, network,
          # one entropy draw above INIT-END, no clock but clockNow, listeners only
          # in the world and only by name, pointer moves only during a drag); the
          # scripts' order; and the owner's rule, nothing darkens: the composite
          # takes no words input (its uniforms a fixed list), the old lift's parts
          # are named nowhere, nothing is drawn onto the canvas after it but what
          # is named.
          python3 .github/workflows/world_rules.py build/site build/src
          # the realm lint: reported (the realms predate the namespaced API)
          node .github/workflows/lint_realms.js report build/src/realm-kit.js $(ls build/src/realm-*.js | grep -v realm-kit)

      - name: Every visit compiles the same shaders
        run: |
          # A returning visitor's world is quick only when Chrome's shader cache answers for every program, and it
          # answers only for a GLSL source it has seen byte for byte. glsl_guard.js runs the site's own scripts (every
          # script index.html loads, as shipped) in node, in a fake browser with a fake WebGL2 context, for 15 visits
          # of five devices (other entropy, hours, windows, densities, clocks and frame rates), and keeps every source
          # the page hands shaderSource, until the world has shown. Within a device every visit must compile the same
          # sources (no per-visit or per-window literal in any GLSL); across devices only the #define lines after
          # #version may differ (DEFS, per device); and the reference device's programs must be exactly
          # glsl_manifest.txt, so a change to any program's text comes with its manifest lines in the same commit and
          # the diff names the programs a deploy makes every returning visitor compile again. After a deliberate
          # change: node .github/workflows/glsl_guard.js build/site --write .github/workflows/glsl_manifest.txt
          # --selftest: the guard's own proof (a planted per-visit literal, a per-window literal and one program
          # changed without its manifest line must each be caught). Exit 3: the fake browser could not bring the world
          # to its show (extend the fake for what the page needs; never relax the rules).
          node .github/workflows/glsl_guard.js build/site --manifest .github/workflows/glsl_manifest.txt --selftest

      - name: The shaders are their golden texts, and compile
        run: |
          # (restructure step 3) the shaders' text lives in .glsl files (src/**/glsl/) that tools/parts.mjs writes
          # back into the scripts. test/shaders.mjs runs the page in glsl_guard's fake browser, takes every program the
          # reference device issues, and fails unless each is exactly its golden text in test/golden/shaders/ (a
          # readable diff of every program a change touches; after a deliberate change: node tools/build.mjs --plain build/site && node test/shaders.mjs build/site
          # --write, committed with the manifest); then compiles and links each in headless Chrome (WebGL2, SwiftShader,
          # playwright-core pinned as W7's). Exit 2 (no WebGL2 context on the runner) warns.
          if [ -z "${PW_CORE:-}" ]; then
            npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/w7" playwright-core@1.49.1
            export PW_CORE="$RUNNER_TEMP/w7/node_modules/playwright-core"
          fi
          rc=0; node test/shaders.mjs build/site --compile || rc=$?
          if [ $rc -eq 2 ]; then echo "::warning::the shaders' compile check could not run (no WebGL2 context on the runner?)"; exit 0; fi
          exit $rc

      - name: Nothing darkens (W7's unit test)
        run: |
          # The owner's rule ("Don't darken the background anywhere ever"): the
          # composite's tail (FS_COMP between W7-TAIL-BEGIN and W7-TAIL-END in
          # the world's script), cut out of the shipped file and run in headless WebGL2
          # over random grounds, pixels and clocks, is the encode and the dither
          # and nothing else: every 8-bit code the reference's, never lower (a
          # darkening) and never higher (a lift or a panel). Then the test's own
          # proof: a planted lift, darkening and panel must each make it fail.
          # The runner's Chrome, driven by playwright-core (pinned, installed for
          # this step only, never part of the site; PW_CORE and CHROME_PATH name
          # others where they are set). Exit 2 (no WebGL2 context on the runner)
          # warns; any lower or higher code fails.
          W=build/src/world.js   # (as written: site/'s is its minified build, the same shader text)
          [ -n "$W" ] && [ -f "$W" ] || { echo "::error::no build/src/world.js for W7's unit test"; exit 1; }
          if [ -z "${PW_CORE:-}" ]; then
            npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/w7" playwright-core@1.49.1
            export PW_CORE="$RUNNER_TEMP/w7/node_modules/playwright-core"
          fi
          rc=0; node .github/workflows/w7_unit.js "$W" --engine chromium > "$RUNNER_TEMP/w7.json" || rc=$?
          tail -1 "$RUNNER_TEMP/w7.json"
          if [ $rc -eq 2 ]; then echo "::warning::W7's unit test could not run (no WebGL2 context on the runner?)"; exit 0; fi
          if [ $rc -ne 0 ]; then cat "$RUNNER_TEMP/w7.json"; echo "::error::W7's unit test: the composite's tail is not the encode and the dither"; exit 1; fi
          for m in lift dark panel; do
            rc=0; node .github/workflows/w7_unit.js "$W" --engine chromium --mutate $m > /dev/null || rc=$?
            if [ $rc -ne 1 ]; then echo "::error::W7's unit test no longer catches a planted $m (exit $rc)"; exit 1; fi
            echo "a planted $m is caught"
          done

      - name: Still skies keep the words legible
        run: |
          cd build/site
          # The stylesheet's still skies (no WebGL2, no script, the moment
          # before the world is drawn, a device too slow for it) must hold
          # their words' colours against the whole gradient, wherever a window
          # puts the words: the text colour (the lettered name, the line, the
          # links) and the dimmed grey (the credit) 4.5:1, the focus ring 3:1
          # (WCAG 1.4.3, 1.4.11). Two families: the hour's still skies (the
          # 404 page, which has no canvas) and the world's (the home page:
          # :has(canvas.sky)), the world's twice, each sky exactly once in
          # each: as the camera of a window narrower than 6:5 draws it, and
          # inside @media (min-aspect-ratio: 6/5), the query the world's
          # camera reads (its wideWin; checked here too).
          CSS=style.css; WORLD=world.js
          python3 - "$CSS" "$WORLD" <<'EOF'
          import re, sys
          css = re.sub(r'/\*.*?\*/', '', open(sys.argv[1]).read(), flags=re.S)
          def lin(v): v /= 255; return v / 12.92 if v <= 0.04045 else ((v + 0.055) / 1.055) ** 2.4
          def rgb(h): h = h.lstrip('#'); return [int(h[i:i + 2], 16) for i in (0, 2, 4)]
          def Y(c): r, g, b = [lin(x) for x in c]; return 0.2126 * r + 0.7152 * g + 0.0722 * b
          def ratio(a, b): a, b = Y(a), Y(b); return (max(a, b) + .05) / (min(a, b) + .05)
          WIDE = '@media (min-aspect-ratio: 6/5)'
          def blocks(s):   # the stylesheet's top level: (the at-rule's head or None, the rules in it)
              out, i = [], 0
              while True:
                  j = s.find('{', i)
                  if j < 0: return out
                  head = s[i:j].strip()
                  if head.startswith('@'):
                      d, k = 1, j + 1
                      while d: d += {'{': 1, '}': -1}.get(s[k], 0); k += 1
                      out.append((re.sub(r'\s+', ' ', head), re.findall(r'([^{}]+)\{([^{}]*)\}', s[j + 1:k - 1]))); i = k
                  else:
                      k = s.index('}', j); out.append((None, [(head, s[j + 1:k])])); i = k + 1
          B = blocks(css)
          rules = [r for q, rs in B if q is None for r in rs]   # outside every at-rule: the tokens and the base skies
          wide = [r for q, rs in B if q == WIDE for r in rs]    # the world's on a window 6:5 or wider
          def tokens(name, world):
              out = {}
              for sel, body in rules:
                  sels = [x.strip() for x in sel.split(',')]
                  mine = [':root', ':root[data-sky="%s"]' % name] + ([':root[data-sky="%s"]:has(canvas.sky)' % name] if world else [])
                  if any(s in sels for s in mine) or (name == 'day' and not world and ':root:not([data-sky])' in sels):
                      out.update(dict(re.findall(r'(--color-[a-z]+):\s*(#[0-9a-fA-F]{6})', body)))
              return out
          def gradients(name, world, rs):   # every rule in rs whose selector list names the family's sky
              sel = (':root[data-sky="%s"]:has(canvas.sky) body' % name) if world else ('body' if name == 'day' else ':root[data-sky="%s"] body' % name)
              out = []
              for s_, body in rs:
                  if sel in [x.strip() for x in s_.split(',')]:
                      m = re.search(r'linear-gradient\(to bottom, ([^)]*)\)\s*(#[0-9a-fA-F]{6})?', body)
                      if m:
                          stops = [(float(p.rstrip('%')) / 100, rgb(c)) for c, p in (x.split() for x in m.group(1).split(','))]
                          out.append((stops, (rgb(m.group(2)) if m.group(2) else None)))
              return out
          fail = 0
          if "matchMedia('(min-aspect-ratio: 6/5)')" not in open(sys.argv[2], encoding='utf-8').read():
              print("::error::%s does not read the wide windows' query, %s" % (sys.argv[2], WIDE)); fail = 1
          for world in (False, True):
              for name in ['day', 'dawn', 'rain', 'sunset', 'dusk', 'night']:
                  t = tokens(name, world)
                  sets = [('world' if world else 'hour', gradients(name, world, rules))] + ([('world6:5', gradients(name, world, wide))] if world else [])
                  for fam, gs in sets:
                      if len(gs) != 1: print('::error::the %s still sky for %s: %d gradients found, exactly one wanted' % (fam, name, len(gs))); fail = 1; continue
                      stops, solid = gs[0]
                      ground = [solid] if solid else []
                      for k in range(201):
                          y = k / 200
                          for (p0, c0), (p1, c1) in zip(stops, stops[1:]):
                              if p0 <= y <= p1:
                                  f = (y - p0) / (p1 - p0) if p1 > p0 else 0
                                  ground.append([c0[i] + (c1[i] - c0[i]) * f for i in range(3)])
                                  break
                      for role, need in [('--color-text', 4.5), ('--color-dimmed', 4.5), ('--color-focus', 3.0)]:
                          worst = min(ratio(rgb(t[role]), g) for g in ground)
                          print('%-8s %-7s %-15s %5.2f' % (fam, name, role, worst))
                          if worst < need:
                              print('::error::%s on the %s %s still sky falls to %.2f:1 (needs %.1f)' % (role, fam, name, worst, need)); fail = 1
          # Print is on white over every still sky, the world's too ("Background graphics" on or off): the print
          # block, after the still skies in the file, sets white paper with a rule as specific as each family's
          # (:root[data-sky] body; :root[data-sky]:has(canvas.sky) body, a rule of its own).
          at = css.find('@media print')
          if at < 0: print('::error::no print block'); sys.exit(1)
          depth, j = 0, css.index('{', at)
          for k in range(j, len(css)):
              depth += {'{': 1, '}': -1}.get(css[k], 0)
              if depth == 0: break
          block = css[j + 1:k]
          if re.search(r'\]\s*(:has\(canvas\.sky\)\s*)?body\s*\{', css[k:]):
              print('::error::a still sky is set after the print block'); fail = 1
          for need in (':root[data-sky] body', ':root[data-sky]:has(canvas.sky) body'):
              ok = any(need in [x.strip() for x in sel.split(',')] and re.search(r'background:\s*#fff(fff)?\s*(;|$)', body.strip())
                       for sel, body in re.findall(r'([^{}]+)\{([^{}]*)\}', block))
              print('print  %-40s %s' % (need, 'white' if ok else 'MISSING'))
              if not ok:
                  print('::error::print: no white paper for %s (a still sky would print)' % need); fail = 1
          sys.exit(fail)
          EOF

      - name: Validate HTML
        run: |
          # Basic HTML validity checks
          file="site/index.html"

          # Must start with doctype
          if ! head -1 "$file" | grep -qi '<!doctype html>'; then
            echo "::error::Missing <!DOCTYPE html>"
            exit 1
          fi

          # Check required tags exist
          for tag in '<html' '<head' '</head>' '<body' '</body>' '</html>'; do
            if ! grep -qi "$tag" "$file"; then
              echo "::error::Missing $tag in $file"
              exit 1
            fi
          done

          # Check charset meta
          if ! grep -qi 'charset.*utf-8' "$file"; then
            echo "::error::Missing charset utf-8 meta tag"
            exit 1
          fi

          # Check viewport meta
          if ! grep -qi 'viewport' "$file"; then
            echo "::error::Missing viewport meta tag"
            exit 1
          fi

          # Check title
          if ! grep -qi '<title>' "$file"; then
            echo "::error::Missing <title> tag"
            exit 1
          fi

          # Check for unclosed tags (basic)
          # The open pattern requires a delimiter after the tag name so that
          # <head> is not also matched by <header>, <main> by <mainbar>, etc.
          for tag in html head body main; do
            opens=$(grep -oiE "<$tag([[:space:]>]|$)" "$file" | wc -l)
            closes=$(grep -oi "</$tag>" "$file" | wc -l)
            if [ "$opens" -ne "$closes" ]; then
              echo "::error::Mismatched <$tag> tags (open=$opens, close=$closes)"
              exit 1
            fi
          done

          echo "HTML validation passed"
