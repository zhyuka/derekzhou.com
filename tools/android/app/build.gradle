// The WebView app: a bare WebView, standing in for an app's in-app browser.
plugins { id 'com.android.application' }
android {
  namespace 'com.derekzhou.lab'
  compileSdk 34
  defaultConfig { applicationId 'com.derekzhou.lab'; minSdk 26; targetSdk 34; versionCode 1; versionName '1' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
